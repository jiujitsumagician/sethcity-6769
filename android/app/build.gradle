plugins {
    id 'com.android.application'
}

// Release signing is read from keystore.properties. The SAME keystore must be
// reused for every future update, or installed copies can't upgrade in place.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'io.dsio.sethcity'
    compileSdk 34

    defaultConfig {
        applicationId 'io.dsio.sethcity'
        minSdk 24            // Android 7.0+ — guarantees a WebView with solid WebGL2
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewAssetLoader — serves the bundled game from a proper https origin
    // so localStorage/IndexedDB (game saves) work reliably.
    implementation 'androidx.webkit:webkit:1.11.0'
}
